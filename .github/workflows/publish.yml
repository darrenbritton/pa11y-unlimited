on:
  release:
    types: [published]
  # A dry run: builds and lists the tarball, never publishes. Publishing needs a published release,
  # and through it a `v*` tag.
  workflow_dispatch:
  # Runs the build job when this file changes, so a broken release pipeline shows up in review
  # rather than on the next release.
  pull_request:
    paths:
      - .github/workflows/publish.yml

# Only the publish job can mint the npm OIDC credential, and it runs nothing from the repository or
# its dependency tree. Packing happens in the build job, which holds no credential and hands over
# a tarball.
permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # Full history brings origin/main for the guard below.
          fetch-depth: 0
          persist-credentials: false

      # A release can be cut from any branch or commit. Only merged code is published.
      - name: Refuse to publish a release whose tag is not on main
        if: github.event_name == 'release'
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::This release's tag is not on main. Merge the release commit first, then tag it."
            exit 1
          fi

      - name: Refuse a release tag that does not match package.json
        if: github.event_name == 'release'
        run: |
          expected="v$(node -p 'require("./package.json").version')"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json, which says $expected."
            exit 1
          fi

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          package-manager-cache: false

      # No install: the package has no build step, so `npm pack` reads `bin` and `lib` straight from
      # the checkout, and no dependency's install script runs anywhere in this workflow.
      - run: |
          mkdir -p "$RUNNER_TEMP/package"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/package"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package
          path: ${{ runner.temp }}/package/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    # Admits only `v*` tags and waits for a required reviewer. Register this environment on the
    # package's trusted publisher, so a workflow that skips it cannot publish.
    environment: production
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package
          path: package

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          # Exact version for its bundled npm, 11.19.0. Trusted publishing needs 11.5.1 or later,
          # and `npm stage` 11.15.0.
          node-version: '24.21.0'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # No checkout and no install. Publishing a tarball also skips the package's lifecycle scripts.
      #
      # Staged, not published: the version waits on npm until a maintainer approves it with 2FA, so
      # a run nobody expected — a stolen GitHub account, a bad merge — cannot reach consumers on its
      # own. With the trusted publisher set to stage-only, `npm publish` from here is refused.
      - name: Stage on npm for approval
        run: npm stage publish package/*.tgz --provenance --access public

      - name: Say where to approve it
        run: |
          {
            echo "### Staged on npm, not yet published"
            echo
            echo "A maintainer must approve it with 2FA: npmjs.com → the package → **Staged Packages** → Approve,"
            echo "or \`npm stage list pa11y-unlimited\` then \`npm stage approve <stage-id>\`."
            echo "Reject it instead if nobody meant to release $GITHUB_REF_NAME."
          } >> "$GITHUB_STEP_SUMMARY"
